spring:
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:loakraken}
    username: ${POSTGRES_USER:loakraken}
    password: ${POSTGRES_PASSWORD:loakraken-local}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

  data:
    redis:
      host: localhost
      port: ${VALKEY_PORT:6379}

# 로컬 전용 값. 스테이징·운영은 비밀값 파일(roster_marker_secret)로 넣는다.
character:
  roster-combat-power:
    marker-secret: ${CHARACTER_ROSTER_COMBAT_POWER_MARKER_SECRET:local-roster-marker-secret}
