services:
  postgres:
    image: postgres:18.6
    container_name: loakraken-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"

    volumes:
      - loakraken-postgres-data:/var/lib/postgresql

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 10

  valkey:
    image: valkey/valkey:9.1.2
    container_name: loakraken-valkey
    restart: unless-stopped

    ports:
      - "127.0.0.1:${VALKEY_PORT}:6379"

    volumes:
      - loakraken-valkey-data:/data

    command:
      - valkey-server
      - --appendonly
      - "yes"

    healthcheck:
      test:
        - CMD
        - valkey-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  loakraken-postgres-data:
  loakraken-valkey-data: