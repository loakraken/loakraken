# 대시보드 파일 프로비저닝. 폴더는 디렉터리 이름을 따른다.
#   loakraken/ : 저장소의 서비스 대시보드(deploy/monitor/grafana/dashboards)
#   external/  : 공개 대시보드(서버에서 fetch-dashboards.sh가 고정 리비전을 받아 둔다, 저장소에 넣지 않음)
apiVersion: 1

providers:
  - name: loakraken
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 60
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: true
