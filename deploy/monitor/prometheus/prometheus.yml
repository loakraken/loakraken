# LOAKraken 모니터링 — Prometheus 수집 설정(compose 프로필 monitor).
# 보관 기간·크기 상한은 compose의 실행 인자(--storage.tsdb.retention.*)에 있다.
global:
  scrape_interval: 30s
  scrape_timeout: 10s
  evaluation_interval: 30s

scrape_configs:
  # api 관리 포트(9090)의 지표. 관리 포트는 metrics망의 api 주소에만 묶여 있고(prometheus만 닿음) edge로 나가지 않는다.
  # 대시보드 질의가 application 라벨로 거르므로 수집 쪽에서 붙인다(백엔드 코드 변경 없음).
  # 지표에 이미 job 태그(collector·retention·warmup 등)가 있어 honor_labels로 그 값을 지킨다(대상 1개·신뢰 대상).
  - job_name: loakraken-api
    metrics_path: /actuator/prometheus
    honor_labels: true
    static_configs:
      - targets: ["api:9090"]
        labels:
          application: loakraken

  # 서버 자원(메모리·디스크·CPU)과 서버 점검 스크립트가 남기는 텍스트 파일 지표(컨테이너 재시작 수).
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
