name: "♻️ Refactor Issue"
description: "외부 동작을 유지하면서 코드 구조를 개선하기 위한 이슈 템플릿"
labels: ["refactor"]
title: "[REFACTOR] "
body:
  - type: markdown
    attributes:
      value: |
        ## 🌿 GitFlow 안내
        이슈 생성 후 발급된 번호로 `develop`에서 `refactor/{issueNumber}-{english-kebab-case}` 브랜치를 만듭니다.
        PR 대상은 `develop`입니다. 기능 추가나 버그 수정은 별도 이슈로 분리해 주세요.

  - type: textarea
    id: refactor-summary
    attributes:
      label: 💡 리팩터링 대상 및 이유
      description: 어떤 부분을 왜 리팩터링하려는지 간결하게 설명해 주세요.
      placeholder: e.g. 중복된 API 호출 로직을 공통 유틸리티로 분리합니다.
    validations:
      required: true

  - type: textarea
    id: current-code
    attributes:
      label: 🔍 현재 코드 상태 (문제점)
      description: 현재 코드의 어떤 점이 문제인지(가독성, 성능, 유지보수 등) 적어주세요.

  - type: textarea
    id: todo-list
    attributes:
      label: ✅ 체크리스트 (구현할 내용)
      description: 작업 항목을 체크박스로 작성해주세요.
      placeholder: |
        - [ ] 공통 모듈 생성
        - [ ] 기존 로직 대체 및 테스트 코드 작성
    validations:
      required: true

  - type: textarea
    id: expected-effect
    attributes:
      label: 🚀 기대 효과
      description: 리팩터링 후 어떤 이점(성능 향상, 가독성 개선 등)이 있는지 적어주세요.

  - type: textarea
    id: verification-plan
    attributes:
      label: ✅ 동작 유지 검증 계획
      description: 기존 응답, 계산 결과, 예외 처리 등이 유지되는지 확인할 테스트와 비교 기준을 작성해 주세요.
    validations:
      required: true
