# 프로젝트 이름을 고정한다. 작업 트리(wt/*)에서 실행해도 같은 postgres·valkey(container_name 고정)를 쓴다.
name: loakraken

services:
  postgres:
    image: postgres:18.6
    container_name: loakraken-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"

    volumes:
      - loakraken-postgres-data:/var/lib/postgresql

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 10

  valkey:
    image: valkey/valkey:9.1.2
    container_name: loakraken-valkey
    restart: unless-stopped

    ports:
      - "127.0.0.1:${VALKEY_PORT}:6379"

    volumes:
      - loakraken-valkey-data:/data

    command:
      - valkey-server
      - --appendonly
      - "yes"

    healthcheck:
      test:
        - CMD
        - valkey-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 10

  # 개발용 수집기·예열 지정 인스턴스(PM 총괄 결정 2026-10-09). 사용자 PC가 켜져 있는 동안만 도는 임시 방식이다.
  # 프로필을 줄 때만 뜬다: docker compose --profile collector up -d --build
  # 수집기·예열은 이 서비스 한 곳에서만 켠다. 다른 로컬 인스턴스와는 같은 Valkey 공유 게이트로 90회/분을 나눈다.
  # 사용법: docs/ops/local-collector.md
  collector:
    profiles: [collector]
    build: .
    image: loakraken-api:collector
    container_name: loakraken-collector
    restart: unless-stopped

    environment:
      SPRING_PROFILES_ACTIVE: local
      # 개발 키는 환경 변수에서 compose 비밀값으로 넘겨 /run/secrets/LOSTARK_API_KEY 파일로만 읽는다(docker inspect에 보이지 않음).
      SPRING_CONFIG_IMPORT: optional:configtree:/run/secrets/
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATA_REDIS_HOST: valkey
      SPRING_DATA_REDIS_PORT: "6379"
      STATS_COLLECTOR_ENABLED: ${COLLECTOR_STATS_ENABLED:-true}
      MARKET_WARMUP_ENABLED: ${COLLECTOR_WARMUP_ENABLED:-true}
      # 개발용 API(프론트 로컬 개발이 8080을 씀)라 기능 플래그는 기본 켬(운영은 기본 꺼짐).
      RECEIPT_ENABLED: ${COLLECTOR_RECEIPT_ENABLED:-true}
      GEM_ENABLED: ${COLLECTOR_GEM_ENABLED:-true}
      CRIT_SPEED_ENABLED: ${COLLECTOR_CRIT_SPEED_ENABLED:-true}

    secrets:
      - source: lostark_api_key
        target: LOSTARK_API_KEY

    ports:
      - "127.0.0.1:${COLLECTOR_PORT:-8080}:8080"

    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy

    healthcheck:
      # 이미지에 curl·wget이 없어 bash /dev/tcp로 확인한다.
      test:
        - CMD
        - bash
        - -c
        - "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /actuator/health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q '\"status\":\"UP\"' <&3"
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 5

    mem_limit: 1280m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

secrets:
  lostark_api_key:
    # 셸(Windows 사용자 환경 변수)의 LOSTARK_API_KEY. 값은 파일·이미지·로그에 남기지 않는다.
    environment: LOSTARK_API_KEY

volumes:
  loakraken-postgres-data:
  loakraken-valkey-data: