name: Deploy

# 서버가 가져오는 배포(pull)의 "승인" 단계다(PM 총괄 결정 2026-10-09). 서버에 SSH로 접속하지 않는다.
# 이 작업은 GitHub Environments(production은 승인자=사용자)를 통과해야 실행되고,
# GHCR 이미지 채널 태그(:production 또는 :staging)를 지정한 커밋 이미지로 옮긴다.
# 서버의 pull-deploy 타이머가 채널 태그를 따라가 배포한다(docs/ops/deploy.md "pull 배포").
#
# 롤백: 이전 sha- 태그로 이 워크플로를 다시 실행한다.
# 준비: loakraken-web 패키지 설정에서 이 저장소(loakraken)에 Write 권한을 준다(Manage Actions access).
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 배포 환경
        type: choice
        options: [staging, production]
        required: true
      api_tag:
        description: "백엔드 이미지 태그(예: sha-1a2b3c4, 운영은 sha-만). 배포 번들도 같은 태그를 쓴다"
        type: string
        required: true
      web_tag:
        description: "프론트 이미지 태그(예: sha-5d6e7f8, 운영은 sha-만)"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      packages: write
    env:
      CHANNEL: ${{ inputs.environment }}
      API_TAG: ${{ inputs.api_tag }}
      WEB_TAG: ${{ inputs.web_tag }}
      REGISTRY: ghcr.io/${{ github.repository_owner }}
    steps:
      - name: Check tags
        run: |
          # 운영은 재현·롤백이 정확한 커밋 태그(sha-)만 받는다. 스테이징만 develop·master 가변 태그를 허용한다.
          if [ "$CHANNEL" = "production" ]; then
            pattern='^sha-[0-9a-f]{7,40}$'
          else
            pattern='^(sha-[0-9a-f]{7,40}|develop|master)$'
          fi
          [[ "$API_TAG" =~ $pattern ]] || { echo "::error::api_tag 형식이 올바르지 않습니다"; exit 1; }
          [[ "$WEB_TAG" =~ $pattern ]] || { echo "::error::web_tag 형식이 올바르지 않습니다"; exit 1; }

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Move channel tags to the approved images
        run: |
          set -euo pipefail
          promote() {
            local image="$1" tag="$2"
            # 레지스트리 안에서 태그만 옮긴다(이미지를 내려받지 않음). 없는 태그면 실패한다.
            docker buildx imagetools inspect "$REGISTRY/$image:$tag" >/dev/null
            docker buildx imagetools create --tag "$REGISTRY/$image:$CHANNEL" "$REGISTRY/$image:$tag"
            digest="$(docker buildx imagetools inspect "$REGISTRY/$image:$CHANNEL" --format '{{json .Manifest.Digest}}' | tr -d '"')"
            echo "| $image | $tag | \`$digest\` |" >> "$GITHUB_STEP_SUMMARY"
          }
          {
            echo "### $CHANNEL 채널 이동"
            echo
            echo "| 이미지 | 태그 | digest |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          promote loakraken-api "$API_TAG"
          promote loakraken-deploy "$API_TAG"
          promote loakraken-web "$WEB_TAG"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo "서버의 pull-deploy 타이머(2분 간격)가 이 릴리스를 가져갑니다. 결과는 Slack #alerts로 옵니다." >> "$GITHUB_STEP_SUMMARY"
