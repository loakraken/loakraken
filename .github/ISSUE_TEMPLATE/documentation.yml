name: "📚 Docs Issue"
description: "문서 작성 및 수정을 위한 이슈 템플릿"
labels: ["documentation"]
title: "[DOCS] "
body:
  - type: markdown
    attributes:
      value: |
        ## 🌿 GitFlow 안내
        이슈 생성 후 발급된 번호로 `develop`에서 `docs/{issueNumber}-{english-kebab-case}` 브랜치를 만듭니다.
        PR 대상은 `develop`입니다.

  - type: textarea
    id: docs-summary
    attributes:
      label: ✍️ 작성/수정할 문서
      description: 어떤 문서를 작업하는지 설명해 주세요.
      placeholder: e.g. 캐릭터 검색 API 응답 및 오류 명세 작성
    validations:
      required: true

  - type: textarea
    id: todo-list
    attributes:
      label: ✅ 체크리스트
      description: 작성해야 할 세부 항목을 적어주세요.
    validations:
      required: true

  - type: textarea
    id: verification-plan
    attributes:
      label: 🔍 문서 검증 계획
      description: 실제 코드와의 일치, 예제 실행, 링크 유효성 등 확인할 기준을 작성해 주세요.
    validations:
      required: true
