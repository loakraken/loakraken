server:
  # 신뢰 프록시(사설망·루프백)가 보낸 X-Forwarded-For만 원격 주소로 쓴다(Tomcat RemoteIpValve). 외부에서 직접 보낸 헤더는 무시한다.
  forward-headers-strategy: native
  # JSON 응답을 gzip으로 보낸다. 홈 일정은 400KB → 8KB 수준이다(#118 P2).
  compression:
    enabled: true
    mime-types: application/json
    min-response-size: 2KB

spring:
  application:
    name: loakraken

  jackson:
    deserialization:
      accept-float-as-int: false
    datatype:
      enum:
        fail-on-numbers-for-enums: true

  threads:
    virtual:
      enabled: true

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  data:
    redis:
      connect-timeout: 1s
      timeout: 1s

lostark:
  api-key: ${LOSTARK_API_KEY:}
  connect-timeout: 3s
  read-timeout: 5s
  # 공식 한도 100회/분에 여유를 둔 예산입니다. 게이트가 Valkey면 같은 키를 쓰는 모든 인스턴스 합산입니다(#107).
  requests-per-minute: 90
  max-concurrent-requests: 4
  summary-ttl: 5m
  gate:
    store: ${LOSTARK_GATE_STORE:valkey}
    # 비우면 API 키 SHA-256 앞 12자. 운영·스테이징은 명시합니다.
    key-id: ${LOSTARK_GATE_KEY_ID:}
    command-timeout: ${LOSTARK_GATE_COMMAND_TIMEOUT:100ms}
  # 클라이언트별 분당 한도(#108). official은 요청이 실제로 일으킨 공식 호출 수입니다.
  client-limit:
    enabled: ${CLIENT_LIMIT_ENABLED:true}
    official-per-minute: ${CLIENT_LIMIT_OFFICIAL:20}
    stats-per-minute: ${CLIENT_LIMIT_STATS:60}
    general-per-minute: ${CLIENT_LIMIT_GENERAL:240}
    bot-per-minute: ${CLIENT_LIMIT_BOT:120}
    exempt-internal: ${CLIENT_LIMIT_EXEMPT_INTERNAL:true}
    # 원정대 전투력 불러오기(L19): 클라이언트당 분당 요청 수
    roster-refresh-per-minute: ${CLIENT_LIMIT_ROSTER_REFRESH:2}
    # 악세 경매 검색기(N13): 클라이언트당 분당 공식 호출(페이지) 수
    auction-search-per-minute: ${CLIENT_LIMIT_AUCTION_SEARCH:5}
    # 보석 매물 직업·스킬 필터: 캐시에 없는 조건 요청 수(기능 전용 분당 몫 10을 한 클라이언트가 다 쓰지 못하게)
    gem-filter-per-minute: ${CLIENT_LIMIT_GEM_FILTER:3}
    # 재료 시세 요청 안의 공식 검색: 클라이언트당 분당 공식 호출 수(공식 호출 한도 official과 따로)
    material-search-per-minute: ${CLIENT_LIMIT_MATERIAL_SEARCH:30}
    # 모든 검색봇 표시 요청이 함께 일으킬 수 있는 분당 공식 호출 수(봇 주소별 한도와 별도)
    bot-official-per-minute: ${CLIENT_LIMIT_BOT_OFFICIAL:20}
    # 검색봇 표시 요청 한 주소의 분당 공식 호출 수(전체 상한보다 작게)
    bot-address-official-per-minute: ${CLIENT_LIMIT_BOT_ADDRESS_OFFICIAL:5}

character:
  snapshots:
    enabled: ${CHARACTER_SNAPSHOTS_ENABLED:false}
  history:
    enabled: ${CHARACTER_HISTORY_ENABLED:true}
  views:
    enabled: ${CHARACTER_VIEWS_ENABLED:true}

market:
  cache:
    prices-ttl: ${MARKET_PRICES_CACHE_TTL:30s}
    options-ttl: ${MARKET_OPTIONS_CACHE_TTL:10m}
    history-ttl: ${MARKET_HISTORY_CACHE_TTL:10m}
    board-scan-ttl: ${MARKET_BOARD_SCAN_CACHE_TTL:3m}
  warmup:
    enabled: ${MARKET_WARMUP_ENABLED:false}
    interval: ${MARKET_WARMUP_INTERVAL:9m}
    # 홈 요약·시세 기본 탭(board?tab=REFINING) 강제 갱신 주기. 가격 캐시 TTL과 같게 둡니다(#154).
    board-interval: ${MARKET_WARMUP_BOARD_INTERVAL:30s}
    # 예열 전체(이력·보드·각인서)의 분당 공식 호출 상한입니다.
    max-calls-per-minute: ${MARKET_WARMUP_MAX_CALLS_PER_MINUTE:15}
    # 유물 각인서 시세(L30, 스펙업 각인서 비용). 캐시 TTL은 주기 × 3입니다.
    relic-books:
      enabled: ${MARKET_WARMUP_RELIC_BOOKS_ENABLED:false}
      interval: ${MARKET_WARMUP_RELIC_BOOKS_INTERVAL:30m}
      max-pages: ${MARKET_WARMUP_RELIC_BOOKS_MAX_PAGES:10}
    # T4 재련 재료·추가 재료 시세(L30 후속, 스펙업 재련 비용). 캐시 TTL은 주기 × 3입니다.
    refining-materials:
      enabled: ${MARKET_WARMUP_REFINING_MATERIALS_ENABLED:false}
      interval: ${MARKET_WARMUP_REFINING_MATERIALS_INTERVAL:10m}
      max-pages-per-tab: ${MARKET_WARMUP_REFINING_MATERIALS_MAX_PAGES:5}
  # 악세 경매 검색기(N13). 기능 몫은 모든 사용자 합 분당 공식 호출 수, reserve는 사용자 경로 몫(docs/accessory-auction-search.md).
  auction-search:
    quota-per-minute: ${MARKET_AUCTION_SEARCH_QUOTA:20}
    reserve: ${MARKET_AUCTION_SEARCH_RESERVE:30}
    max-scan-pages: ${MARKET_AUCTION_SEARCH_MAX_SCAN_PAGES:3}
    cache-ttl: ${MARKET_AUCTION_SEARCH_CACHE_TTL:120s}
  # 보석 매물 직업·스킬 필터(#542). 끄면 목록·조건 붙은 매물이 404(공식 호출 0). 몫은 조건 붙은 매물 전체(모든 사용자 합)의 분당 공식 호출 수.
  gem-filter:
    enabled: ${MARKET_GEM_FILTER_ENABLED:true}
    quota-per-minute: ${MARKET_GEM_FILTER_QUOTA:10}
    reserve: ${MARKET_GEM_FILTER_RESERVE:40}

# 크라켄 점수(#522·#559): 캐릭터 응답의 krakenScore. 꺼져 있으면 DISABLED(공식 호출 변화 없음, 켜도 이미 받은 원문으로만 계산).
kraken-score:
  enabled: ${KRAKEN_SCORE_ENABLED:false}

# 공식 전투정보실 페이지 정보(#531). 꺼져 있으면 200에 값 null이고 공식 페이지를 부르지 않는다.
# 검색한 캐릭터만, 뽑은 값만 캐시, 인스턴스 전체 요청 간격 1초, 실패하면 쉬고 계속되면 멈춘다.
armory-page:
  enabled: ${ARMORY_PAGE_ENABLED:false}
  # User-Agent에 서비스 이름과 함께 밝히는 연락 주소(서비스 안내 페이지 또는 서비스 전용 메일). 운영 설정에서 넣는다.
  contact: ${ARMORY_PAGE_CONTACT:}
  # 스킬 코드(#532): 페이지 정보가 켜져 있고 이것도 켜야 동작한다. 캐릭터당 공식 웹 요청 2번(페이지 + 코드).
  skill-code:
    enabled: ${ARMORY_PAGE_SKILL_CODE_ENABLED:false}

loakraken:
  features:
    # 악세 경매 검색기(N13) 경로. 끄면 404이고 OpenAPI에도 없습니다.
    auction-search: ${FEATURE_AUCTION_SEARCH:false}

stats:
  collector:
    enabled: ${STATS_COLLECTOR_ENABLED:false}
    interval: ${STATS_COLLECTOR_INTERVAL:3s}
    reserve: ${STATS_COLLECTOR_RESERVE:40}
  # 시드 목록(#255): 이름마다 원정대를 한 번 훑는다. 이름 목록은 쉼표 구분 환경 변수 또는 운영 서버의 파일(저장소에 커밋하지 않음).
  seed:
    enabled: ${STATS_SEED_ENABLED:false}
    names: ${STATS_SEED_NAMES:}
    file: ${STATS_SEED_FILE:}

# 수집품(내실) 랭킹(#295): 웹 화면이 준비될 때까지 기본 꺼짐
ranking:
  collectibles:
    enabled: ${RANKING_COLLECTIBLES_ENABLED:false}
    # 수집품 보유율 예열(#305): 랭킹이 켜져 있을 때만 돈다. 테스트·로컬은 꺼 둔다.
    warmup-enabled: ${RANKING_COLLECTIBLES_WARMUP_ENABLED:false}
  rosters:
    # 원정대 랭킹(#297): 웹 화면이 준비될 때까지 꺼짐.
    enabled: ${RANKING_ROSTERS_ENABLED:false}
  titles:
    # 칭호 장착 확인 비율(#311): 웹 화면이 준비될 때까지 꺼짐.
    enabled: ${RANKING_TITLES_ENABLED:false}
  guilds:
    # 캐릭터 길드 탭·인기 길드(#301·#529): 웹 화면이 준비될 때까지 꺼짐.
    enabled: ${RANKING_GUILDS_ENABLED:false}
    list:
      # 길드 랭킹 API(#581): 길드 탭·인기 길드와 따로 켠다. 평균 기준 정리(#580) 전까지 꺼짐.
      enabled: ${RANKING_GUILDS_LIST_ENABLED:false}

# 원정대 영수증(#174)은 계산 일치 원칙(사용자 지시 10-09) 검증 전까지 공개하지 않는다. 검증 서버에서만 켠다.
receipt:
  enabled: ${RECEIPT_ENABLED:false}

# 젬 가공 계획 API: 첫 운영 릴리스에서 기본 꺼짐(웹 미사용, 교차 검증 전)
gem:
  enabled: ${GEM_ENABLED:false}

# 치명타·공이속 계산 API: 웹 공개 판단 전까지 기본 꺼짐(개발·검증 서버는 CRIT_SPEED_ENABLED=true)
crit-speed:
  enabled: ${CRIT_SPEED_ENABLED:false}

# 전투력 시뮬레이터 API: 계산식(실측 대조) 확정 전까지 기본 꺼짐
combat-power-sim:
  enabled: ${COMBAT_POWER_SIM_ENABLED:false}

# 스펙업 가이드(#315): 꺼져 있으면 SPEC_UP_DISABLED(404). 시뮬레이터 계산식 검증 뒤 켠다.
spec-up:
  enabled: ${SPEC_UP_ENABLED:false}

home:
  cache:
    calendar-ttl: ${HOME_CALENDAR_CACHE_TTL:30m}
    news-ttl: ${HOME_NEWS_CACHE_TTL:10m}

management:
  metrics:
    distribution:
      # p95·p99를 Prometheus에서 계산하도록 HTTP 요청 지연 히스토그램을 낸다(#143).
      percentiles-histogram:
        http.server.requests: true

springdoc:
  paths-to-match: /api/v1/**
  override-with-generic-response: false
  remove-broken-reference-definitions: false
  api-docs:
    version: OPENAPI_3_1
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true
