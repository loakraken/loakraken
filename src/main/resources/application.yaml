spring:
  application:
    name: loakraken

  jackson:
    deserialization:
      accept-float-as-int: false
    datatype:
      enum:
        fail-on-numbers-for-enums: true

  threads:
    virtual:
      enabled: true

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  data:
    redis:
      connect-timeout: 1s
      timeout: 1s

lostark:
  api-key: ${LOSTARK_API_KEY:}
  connect-timeout: 3s
  read-timeout: 5s
  # 공식 한도 100회/분에 여유를 둔 인스턴스별 예산입니다.
  requests-per-minute: 90
  max-concurrent-requests: 4
  summary-ttl: 5m

character:
  snapshots:
    enabled: ${CHARACTER_SNAPSHOTS_ENABLED:false}
  history:
    enabled: ${CHARACTER_HISTORY_ENABLED:true}

market:
  cache:
    prices-ttl: ${MARKET_PRICES_CACHE_TTL:30s}
    options-ttl: ${MARKET_OPTIONS_CACHE_TTL:10m}
    history-ttl: ${MARKET_HISTORY_CACHE_TTL:10m}
    board-scan-ttl: ${MARKET_BOARD_SCAN_CACHE_TTL:3m}
  warmup:
    enabled: ${MARKET_WARMUP_ENABLED:true}
    interval: ${MARKET_WARMUP_INTERVAL:9m}

springdoc:
  paths-to-match: /api/v1/**
  override-with-generic-response: false
  remove-broken-reference-definitions: false
  api-docs:
    version: OPENAPI_3_1
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true
