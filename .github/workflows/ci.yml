name: Backend CI

# develop·master push에서 빌드·테스트(build)가 성공한 커밋만 GHCR에 api 이미지와 배포 번들을 올린다(publish, PM 총괄 결정 2026-10-09).
# 이미지가 없는 커밋은 배포 승인(deploy.yml)에서 태그를 찾지 못해 배포할 수 없다.
# 서드파티 액션은 커밋 SHA로 고정한다(주석은 해당 태그).
# Actions 시간 절약(10-10): 초안 PR은 건너뛰고, 문서·마크다운만 바뀐 push는 돌지 않는다.
# PR에는 paths-ignore를 두지 않는다. 필수 상태 검사(룰셋)로 지정하면 검사가 아예 안 뜬 PR은 병합할 수 없기 때문이다.
# 같은 PR·브랜치의 이전 실행은 취소한다(concurrency).
on:
  pull_request:
    branches: [develop, master]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [develop, master]
    paths-ignore:
      - docs/**
      - '**/*.md'

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/loakraken-api

jobs:
  build:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
      - name: Build and verify Google Java format
        run: bash ./gradlew build --no-daemon
        env:
          # 금지 이름 목록(줄바꿈 구분). 저장소에 두지 않는다. 없으면(포크 PR 등) 이름 검사만 건너뛴다.
          BLOCKED_TERMS: ${{ secrets.BLOCKED_TERMS }}
          # 저장소 안 PR·push면 목록이 꼭 있어야 한다(비면 가드 실패). 포크 PR은 비밀값이 없어 false.
          BLOCKED_TERMS_REQUIRED: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      - name: Upload OpenAPI contract
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openapi-contract
          path: build/generated/*.json
          if-no-files-found: error
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: build/reports/tests/test
          if-no-files-found: ignore

  # 빌드·테스트 통과 뒤에만 이미지를 올린다. 저장소 변수 PUBLISH_IMAGES가 'true'일 때만(기본 꺼짐).
  publish:
    name: Publish images
    needs: build
    if: github.event_name == 'push' && vars.PUBLISH_IMAGES == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      # 이미지 검사 결과(SARIF)를 코드 스캐닝에 올릴 때만 쓴다. 공개 저장소에서도 알림 목록은 쓰기 권한이 있는 사람만 본다.
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: api-image
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=backend-image
          cache-to: type=gha,mode=max,scope=backend-image
          provenance: false
      # 배포 번들(compose·Caddyfile·스크립트). 서버의 pull 배포가 api와 같은 sha- 태그로 가져간다.
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: bundle-meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/loakraken-deploy
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
      - name: Publish deploy bundle
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy
          file: deploy/Dockerfile.bundle
          push: true
          tags: ${{ steps.bundle-meta.outputs.tags }}
          labels: ${{ steps.bundle-meta.outputs.labels }}
          provenance: false
      # 올린 api 이미지의 취약점 검사(보고만). 2주 동안 결과를 본 뒤 빌드를 막을지 정한다.
      # 검사·업로드가 실패해도 이미지 발행은 성공으로 남는다(continue-on-error, exit-code 0).
      # 결과는 로그에 표로 찍지 않고 SARIF 파일로만 만들어 코드 스캐닝에 올린다(공개 저장소의 실행 로그는 누구나 본다).
      # trivy-action은 2026-03 태그 변조 사고 뒤에 나온 불변 릴리스 v0.36.0을 커밋 SHA로 고정하고, trivy 본체 버전도 적어 둔다.
      - name: Scan api image (report only)
        id: trivy
        continue-on-error: true
        timeout-minutes: 10
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          scan-type: image
          image-ref: ${{ env.IMAGE }}@${{ steps.api-image.outputs.digest }}
          format: sarif
          output: trivy-api.sarif
          exit-code: '0'
          hide-progress: true
      - name: Upload scan to code scanning
        if: always() && hashFiles('trivy-api.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy-api.sarif
          category: trivy-image-api
      - name: Scan summary
        if: always()
        env:
          SCAN: ${{ steps.trivy.outcome }}
        run: |
          echo "이미지 검사(보고만): ${SCAN} — 결과는 Security 탭 코드 스캐닝(trivy-image-api)에서 봅니다." >> "$GITHUB_STEP_SUMMARY"
