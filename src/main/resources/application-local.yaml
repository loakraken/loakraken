spring:
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:loakraken}
    username: ${POSTGRES_USER:loakraken}
    password: ${POSTGRES_PASSWORD:loakraken-local}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

  data:
    redis:
      host: localhost
      port: ${VALKEY_PORT:6379}
