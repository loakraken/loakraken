name: Backend CI

# develop·master push에서 빌드·테스트(build)가 성공한 커밋만 GHCR에 api 이미지와 배포 번들을 올린다(publish, PM 총괄 결정 2026-10-09).
# 이미지가 없는 커밋은 배포 승인(deploy.yml)에서 태그를 찾지 못해 배포할 수 없다.
# 서드파티 액션은 커밋 SHA로 고정한다(주석은 해당 태그).
# Actions 시간 절약(10-10): 초안 PR은 건너뛰고, 문서·마크다운만 바뀐 push는 돌지 않는다.
# PR에는 paths-ignore를 두지 않는다. 필수 상태 검사(룰셋)로 지정하면 검사가 아예 안 뜬 PR은 병합할 수 없기 때문이다.
# 같은 PR·브랜치의 이전 실행은 취소한다(concurrency).
on:
  pull_request:
    branches: [develop, master]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [develop, master]
    paths-ignore:
      - docs/**
      - '**/*.md'

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/loakraken-api

jobs:
  build:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
      - name: Build and verify Google Java format
        run: bash ./gradlew build --no-daemon
      - name: Upload OpenAPI contract
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openapi-contract
          path: build/generated/*.json
          if-no-files-found: error
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: build/reports/tests/test
          if-no-files-found: ignore

  # 빌드·테스트 통과 뒤에만 이미지를 올린다. 저장소 변수 PUBLISH_IMAGES가 'true'일 때만(기본 꺼짐).
  publish:
    name: Publish images
    needs: build
    if: github.event_name == 'push' && vars.PUBLISH_IMAGES == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=backend-image
          cache-to: type=gha,mode=max,scope=backend-image
          provenance: false
      # 배포 번들(compose·Caddyfile·스크립트). 서버의 pull 배포가 api와 같은 sha- 태그로 가져간다.
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: bundle-meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/loakraken-deploy
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
      - name: Publish deploy bundle
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy
          file: deploy/Dockerfile.bundle
          push: true
          tags: ${{ steps.bundle-meta.outputs.tags }}
          labels: ${{ steps.bundle-meta.outputs.labels }}
          provenance: false
