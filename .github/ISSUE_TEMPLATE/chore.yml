name: "⚙️ Chore Issue"
description: "설정 변경, 라이브러리 업데이트 등 기타 작업을 위한 템플릿"
labels: ["chore"]
title: "[CHORE] "
body:
  - type: markdown
    attributes:
      value: |
        ## 🌿 GitFlow 안내
        이슈 생성 후 발급된 번호로 `develop`에서 `chore/{issueNumber}-{english-kebab-case}` 브랜치를 만듭니다.
        PR 대상은 `develop`입니다. 일반 설정 작업은 `master`에 직접 반영하지 않습니다.

  - type: textarea
    id: chore-summary
    attributes:
      label: 📄 작업 내용
      description: 수행할 작업에 대해 설명해 주세요.
      placeholder: e.g. PostgreSQL 및 Valkey 테스트 이미지 버전 고정
    validations:
      required: true

  - type: textarea
    id: verification-plan
    attributes:
      label: 🔍 영향 범위 및 검증 계획
      description: 빌드, 실행 환경, 의존성 등에 미치는 영향과 확인 방법을 작성해 주세요.
      placeholder: e.g. 개발 환경과 같은 이미지로 Testcontainers 테스트를 실행합니다.
    validations:
      required: true

  - type: textarea
    id: todo-list
    attributes:
      label: ✅ 체크리스트
      description: 구체적인 작업 단계를 작성해주세요.
    validations:
      required: true
