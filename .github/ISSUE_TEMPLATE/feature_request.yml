name: "✨ Feature Issue"
description: "새로운 기능 개발을 위한 이슈 템플릿"
labels: ["feature"]
title: "[FEAT] "
body:
  - type: markdown
    attributes:
      value: |
        ## 🌿 GitFlow 안내
        이슈 생성 후 발급된 번호로 `develop`에서 `feat/{issueNumber}-{english-kebab-case}` 브랜치를 만듭니다.
        PR 대상은 `develop`입니다. 하나의 이슈는 하나의 명확한 기능을 다룹니다.

  - type: textarea
    id: summary
    attributes:
      label: 📄 이슈 내용 (기능 요약)
      description: 구현하고자 하는 기능에 대해 간단하게 요약 설명해 주세요.
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: 📝 상세 내용 및 요구사항
      description: 기능 추가와 관련된 추가 정보(배경, 필요성, 구체적인 요구사항 등)를 작성해 주세요.

  - type: textarea
    id: todo-list
    attributes:
      label: ✅ 체크리스트 (구현할 내용)
      description: 구현 항목을 체크박스로 작성해주세요.
      placeholder: |
        - [ ] 캐릭터 프로필 외부 응답 DTO 정의
        - [ ] Domain 변환 및 조회 서비스 구현
        - [ ] 정상 조회 및 미존재 응답 검증
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: 🎯 완료 조건 및 검증 계획
      description: 어떤 동작을 확인하면 완료인지, 정상·실패 상황을 어떻게 검증할지 작성해 주세요.
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: 📍 레퍼런스
      description: 참고할만한 자료(링크, 문서 등)가 있다면 작성해 주세요.
      placeholder: |
        e.g.
        - [Figma 디자인] (https://...)
        - [관련 외부 문서] (https://...)
