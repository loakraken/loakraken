# LOAKraken 운영 스택 초안: 사업자와 무관한 Linux 서버 1대 + docker compose.
# 절차·비밀 파일 준비는 운영 문서 deploy를 따른다.
#
#   docker compose -f compose.prod.yaml --env-file stack.env up -d --wait
#
# 공개 포트는 edge(80/443)뿐이다. web·api·postgres·valkey는 호스트에 포트를 열지 않는다(모니터링 grafana만 호스트 127.0.0.1).
# 망: public(edge↔web), internal(web↔api, 공식 API 호출을 위한 외부 통신 허용), data(api↔postgres·valkey, 외부 통신 차단),
#     monitor(프로필 monitor: prometheus·node-exporter·grafana).
# 비밀값은 compose secrets로 파일 마운트(/run/secrets/...)하며 환경변수·이미지·저장소에 두지 않는다.

name: ${STACK_NAME:-loakraken}

# 컨테이너 로그는 서비스마다 10MB × 5개까지만 남긴다(디스크 보호, 오래된 로그 자동 삭제).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  edge:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${EDGE_HTTP_PORT:-80}:80"
      - "${EDGE_HTTPS_PORT:-443}:443"
      - "${EDGE_HTTPS_PORT:-443}:443/udp"
    environment:
      SITE_ADDRESS: "${SITE_ADDRESS:?SITE_ADDRESS가 필요합니다(예 loakraken.gg)}"
    volumes:
      # 운영(Cloudflare 프록시)은 CADDYFILE=Caddyfile.cloudflare. 기본 Caddyfile은 로컬 점검·프록시 없는 구성용.
      - ./${CADDYFILE:-Caddyfile}:/etc/caddy/Caddyfile:ro
      - ./cloudflare/trusted-proxies.caddy:/etc/caddy/cloudflare-ips.caddy:ro
      # Cloudflare Origin CA 인증서(origin.pem·origin.key). Cloudflare 모드에서만 쓴다.
      - ${SECRETS_DIR:?SECRETS_DIR가 필요합니다}/tls:/etc/caddy/tls:ro
      - edge-data:/data
      - edge-config:/config
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      # Caddyfile의 컨테이너 내부 전용 확인 포트(127.0.0.1:2080). Caddy가 멈추거나 설정 오류로 뜨지 않으면 unhealthy.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2080/"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - public
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    # 임시 파일은 메모리에(이미지 루트에 쓰지 않게).
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    mem_limit: ${EDGE_MEM_LIMIT:-128m}
    # 프로세스 수 상한(포크 폭주가 서버 전체로 번지지 않게). Caddy 한 프로세스(스레드 수십 개).
    pids_limit: 128

  web:
    image: "${WEB_IMAGE:?WEB_IMAGE가 필요합니다}"
    restart: unless-stopped
    logging: *default-logging
    environment:
      LOAKRAKEN_API_ORIGIN: http://api:8080
      # 사이트 기준 URL(metadataBase·canonical·sitemap·robots, web #96). 서버 전용·요청 시점에 읽는다.
      # 운영만 https://loakraken.gg이고, 다른 값이면 robots가 색인을 막는다. 빠뜨리지 않게 필수로 둔다.
      SITE_URL: "${SITE_URL:?SITE_URL이 필요합니다(운영 https://loakraken.gg)}"
      # 기능 플래그(web #233): 치명 계산 도구(치적) 노출. on|off, 비우면 web 기본값(SITE_URL이 운영 주소일 때만 숨김).
      # 운영 stack.env는 off를 명시한다(PM 총괄 결정 10-09: 첫 운영 배포 제외). 스테이징은 비워 두어 보인다.
      CRIT_SPEED_TOOL: "${CRIT_SPEED_TOOL:-}"
      # 전투력 시뮬레이터 화면(web #365). on|off, 비우면 web 기본값. 운영은 공개 기준(비교 기준 대조) 전까지 off(백엔드 COMBAT_POWER_SIM_ENABLED=false와 이중 숨김).
      COMBAT_POWER_SIM: "${COMBAT_POWER_SIM:-}"
      # 원정대 영수증 화면(web). on|off, 비우면 web 기본값. 운영은 계산 재대조 전까지 off(PM 총괄 10-11, api RECEIPT_ENABLED=false와 함께).
      RECEIPT_TOOL: "${RECEIPT_TOOL:-}"
      # 캐릭터 '세팅 점검' 탭(web #489). on|off, 비우면 web 기본값(운영 SITE_URL이면 숨김). 운영은 명시로 off(PM 총괄 10-11, 표본이 적은 동안).
      SETTING_CHECK_TAB: "${SETTING_CHECK_TAB:-}"
      # 원정대 랭킹 화면(web #515). on|off, 비우면 web 기본값(운영 SITE_URL이면 숨김). api RANKING_ROSTERS_ENABLED와 함께 켠다.
      ROSTER_RANKING: "${ROSTER_RANKING:-}"
      # 캐릭터 화면의 전투정보실 페이지 정보 요청(web #519). on|off, 비우면 운영 호스트에서 꺼짐(요청 안 보냄). 백엔드 플래그와 함께 켠다.
      ARMORY_PAGE: "${ARMORY_PAGE:-}"
      # 나머지 화면 스위치도 모두 넘긴다(오픈 준비 A3). 규칙은 위와 같다: on|off, 비우면 web 기본값(운영 SITE_URL이면 숨김).
      # 켤 때는 백엔드 짝과 같이 켠다: SPEC_UP_GUIDE↔SPEC_UP_ENABLED, ACCESSORY_SEARCH_TOOL↔FEATURE_AUCTION_SEARCH,
      # COLLECTIBLE_RANKING↔RANKING_COLLECTIBLES_ENABLED, GUILD_RANKING↔RANKING_GUILDS_LIST_ENABLED(+길드 탭은 RANKING_GUILDS_ENABLED),
      # POPULAR_GUILDS↔RANKING_GUILDS_ENABLED,
      # TITLE_STATS↔RANKING_TITLES_ENABLED, PRICE_ALERTS↔ALERTS_PUSH_ENABLED(+VAPID 키, 따로 준비).
      ACCESSORY_SEARCH_TOOL: "${ACCESSORY_SEARCH_TOOL:-}"
      CHARACTER_EFFICIENCY: "${CHARACTER_EFFICIENCY:-}"
      COLLECTIBLE_RANKING: "${COLLECTIBLE_RANKING:-}"
      EFFICIENCY_RANKING: "${EFFICIENCY_RANKING:-}"
      GUILD_RANKING: "${GUILD_RANKING:-}"
      POPULAR_GUILDS: "${POPULAR_GUILDS:-}"
      # 캐릭터 화면 길드 탭(web #924에서 GUILD_RANKING과 나뉨). 백엔드 짝은 RANKING_GUILDS_ENABLED.
      GUILD_TAB: "${GUILD_TAB:-}"
      SPEC_UP_GUIDE: "${SPEC_UP_GUIDE:-}"
      TITLE_STATS: "${TITLE_STATS:-}"
      # 이 둘은 비우면 어디서나 꺼짐(on일 때만 켜짐): 검색엔진 색인, 시세 알림 화면.
      CHARACTER_INDEXING: "${CHARACTER_INDEXING:-}"
      PRICE_ALERTS: "${PRICE_ALERTS:-}"
      # 검색 엔진 소유 확인 태그(web 확인 태그 PR). 비우면 태그를 넣지 않는다. 값은 각 검색 엔진 화면에서 받은 확인 코드(비밀값 아님 — 페이지에 공개됨).
      GOOGLE_SITE_VERIFICATION: "${GOOGLE_SITE_VERIFICATION:-}"
      NAVER_SITE_VERIFICATION: "${NAVER_SITE_VERIFICATION:-}"
      # Node 힙 상한. 컨테이너 한도(WEB_MEM_LIMIT)보다 작게 둬 한도에 닿기 전에 GC가 돈다(2GB 서버 기준, 운영 문서 deploy "메모리 예산").
      NODE_OPTIONS: "${WEB_NODE_OPTIONS:---max-old-space-size=256}"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/about').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
    mem_limit: ${WEB_MEM_LIMIT:-384m}
    # 프로세스 수 상한(포크 폭주가 서버 전체로 번지지 않게). Node 한 프로세스(스레드 10여 개).
    pids_limit: 256
    networks:
      public:
      internal:
        # 백엔드는 이 주소에서 온 X-Forwarded-For만 믿는다(api의 SERVER_TOMCAT_REMOTEIP_INTERNALPROXIES).
        ipv4_address: ${WEB_INTERNAL_IP:-172.31.250.10}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  api:
    image: "${API_IMAGE:?API_IMAGE가 필요합니다}"
    restart: unless-stopped
    logging: *default-logging
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # /run/secrets의 파일 이름을 설정 키로 읽는다(DB_PASSWORD, LOSTARK_API_KEY, spring.data.redis.password).
      SPRING_CONFIG_IMPORT: optional:configtree:/run/secrets/
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-loakraken}
      DB_USERNAME: ${POSTGRES_USER:-loakraken}
      VALKEY_HOST: valkey
      VALKEY_PORT: "6379"
      # valkey의 앱 전용 사용자(기본 사용자는 꺼져 있다). 암호는 비밀 파일 spring.data.redis.password.
      SPRING_DATA_REDIS_USERNAME: app
      # 공식 API 호출 한도를 쓰는 백그라운드 작업은 스택마다 명시한다(운영 1곳만 true).
      STATS_COLLECTOR_ENABLED: ${STATS_COLLECTOR_ENABLED:-false}
      # 수집기 속도. 기본 3s·예약분 40(사용자 요청 몫). 공개 전 한시로 1s·25까지 허용(PM-백엔드 10-10 23:26), 도메인 공개 전 기본으로 되돌린다.
      STATS_COLLECTOR_INTERVAL: ${STATS_COLLECTOR_INTERVAL:-3s}
      STATS_COLLECTOR_RESERVE: ${STATS_COLLECTOR_RESERVE:-40}
      # 방문자 한 명이 분당 일으킬 수 있는 공식 호출 수(기본 20). 접속이 몰려 예산 거절이 이어질 때만 낮춘다(부하 대응 2단계).
      CLIENT_LIMIT_OFFICIAL: ${CLIENT_LIMIT_OFFICIAL:-20}
      # 요청 본문 크기 상한(기본 64KB). 앞단 프록시 상한(256KB)보다 작게 둔다.
      HTTP_MAX_REQUEST_BODY: ${HTTP_MAX_REQUEST_BODY:-64KB}
      # 검색봇 표시 요청 전체가 분당 일으킬 수 있는 공식 호출 수(기본 20). 캐릭터 페이지 색인을 켤 때만 낮춘다.
      CLIENT_LIMIT_BOT_OFFICIAL: ${CLIENT_LIMIT_BOT_OFFICIAL:-20}
      # 시드 목록(#255): 쉼표 구분 이름. 값은 운영 서버 stack.env에만 둔다(저장소 커밋 금지).
      STATS_SEED_ENABLED: ${STATS_SEED_ENABLED:-false}
      STATS_SEED_NAMES: ${STATS_SEED_NAMES:-}
      # 시드 파일(#271): 한 줄에 한 이름, # 주석. 스택 디렉터리 seed/에 두면 /seed로 읽기 전용 마운트된다(예: /seed/names.txt). 기동 때 한 번 읽는다.
      STATS_SEED_FILE: ${STATS_SEED_FILE:-}
      MARKET_WARMUP_ENABLED: ${MARKET_WARMUP_ENABLED:-false}
      # 기능 플래그(#214): 비우면 꺼짐. 스테이징은 치명 계산을 켜고(web 치적 도구가 보임), 영수증·젬 가공은 검증 때만 켠다.
      CRIT_SPEED_ENABLED: ${CRIT_SPEED_ENABLED:-false}
      GEM_ENABLED: ${GEM_ENABLED:-false}
      # 팔찌·젬 효율 랭킹을 캐릭터 카드의 실 효율로 센다(#647). 켤 때 web EFFICIENCY_RANKING과 함께(GEM_ENABLED는 보석 가공 API라 따로).
      STATS_EFFICIENCYRANKING_REAL: ${STATS_EFFICIENCYRANKING_REAL:-false}
      RECEIPT_ENABLED: ${RECEIPT_ENABLED:-false}
      # 전투력 시뮬레이터(#239): 보석·재련·각인 계산식 확정 전까지 운영 꺼짐(PM 총괄 10-10).
      COMBAT_POWER_SIM_ENABLED: ${COMBAT_POWER_SIM_ENABLED:-false}
      # 수집품(내실) 랭킹(#295): 웹 화면이 준비될 때까지 꺼짐.
      RANKING_COLLECTIBLES_ENABLED: ${RANKING_COLLECTIBLES_ENABLED:-false}
      # 수집품 보유율 예열(#305): 수집품 랭킹을 켤 때 함께 돈다(공식 호출 없음, 9분마다 서버 수만큼 DB 집계).
      RANKING_COLLECTIBLES_WARMUP_ENABLED: ${RANKING_COLLECTIBLES_WARMUP_ENABLED:-true}
      # 원정대 랭킹(#297): 웹 화면이 준비될 때까지 꺼짐.
      RANKING_ROSTERS_ENABLED: ${RANKING_ROSTERS_ENABLED:-false}
      # 캐릭터 길드 탭·인기 길드(#301·#529): 웹 화면이 준비될 때까지 꺼짐.
      RANKING_GUILDS_ENABLED: ${RANKING_GUILDS_ENABLED:-false}
      # 길드 랭킹 API(#581): 길드 탭과 따로 켠다.
      RANKING_GUILDS_LIST_ENABLED: ${RANKING_GUILDS_LIST_ENABLED:-false}
      # 칭호 장착 확인 비율(#311): 웹 화면이 준비될 때까지 꺼짐.
      RANKING_TITLES_ENABLED: ${RANKING_TITLES_ENABLED:-false}
      # 나머지 기능 스위치(오픈 준비 A3). 기본값은 앱 기본값과 같다 — 넘기기만 하고 동작은 바꾸지 않는다.
      SPEC_UP_ENABLED: ${SPEC_UP_ENABLED:-false}
      FEATURE_AUCTION_SEARCH: ${FEATURE_AUCTION_SEARCH:-false}
      MARKET_GEM_FILTER_ENABLED: ${MARKET_GEM_FILTER_ENABLED:-true}
      MARKET_GEM_FILTER_QUOTA: ${MARKET_GEM_FILTER_QUOTA:-10}
      # 시세 알림 웹 푸시. 켜도 VAPID 키가 없으면 경로가 404다(키 전달은 켜기로 정할 때 따로).
      ALERTS_PUSH_ENABLED: ${ALERTS_PUSH_ENABLED:-false}
      # 전투정보실 페이지 정보(생활 스킬). 웹 ARMORY_PAGE와 같이 켠다. 켜면 검색한 캐릭터마다 공식 전투정보실 페이지를 읽는다(간격 1초·캐시 6시간).
      ARMORY_PAGE_ENABLED: ${ARMORY_PAGE_ENABLED:-false}
      # 공식 페이지 요청의 User-Agent에 밝히는 서비스 연락 주소(서비스 안내 페이지 또는 서비스 전용 메일). 비우면 서비스 이름만.
      ARMORY_PAGE_CONTACT: "${ARMORY_PAGE_CONTACT:-}"
      # 스킬 코드(페이지 정보가 켜져 있어야 동작). 켜면 스킬 탭을 연 캐릭터마다 공식 요청이 2번(페이지 + 코드) 든다.
      ARMORY_PAGE_SKILL_CODE_ENABLED: ${ARMORY_PAGE_SKILL_CODE_ENABLED:-false}
      # 크라켄 점수(캐릭터 응답의 krakenScore). 켜도 공식 호출은 늘지 않는다(이미 받은 원문으로 계산).
      KRAKEN_SCORE_ENABLED: ${KRAKEN_SCORE_ENABLED:-false}
      # 시세 예열 세부(MARKET_WARMUP_ENABLED가 켜진 인스턴스에서만 돈다). 재련 재료·유물 각인서는 켜면 공식 호출이 늘어 수집기와 게이트를 나눈다.
      MARKET_WARMUP_REFINING_MATERIALS_ENABLED: ${MARKET_WARMUP_REFINING_MATERIALS_ENABLED:-false}
      MARKET_WARMUP_RELIC_BOOKS_ENABLED: ${MARKET_WARMUP_RELIC_BOOKS_ENABLED:-false}
      API_DOCS_ENABLED: "false"
      # 관리(actuator) 포트를 앱 포트와 나누고, metrics망의 api 주소에만 묶는다(prometheus만 닿음, internal·data망의 다른 컨테이너는 닿지 않음).
      MANAGEMENT_SERVER_PORT: "9090"
      MANAGEMENT_SERVER_ADDRESS: ${API_METRICS_IP:?API_METRICS_IP가 필요합니다(env 예시 참고)}
      # liveness는 프로세스 생존, readiness는 DB·Valkey까지 확인한다(출시 점검표 R2).
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
      MANAGEMENT_ENDPOINT_HEALTH_GROUP_READINESS_INCLUDE: readinessState,db,redis
      # 구조화 로그(JSON, ECS 형식). 감시 설계의 로그 원칙(운영 문서 deploy).
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
      # JVM 힙 = 컨테이너 한도의 65%(768m이면 약 500MB). 나머지는 메타스페이스·스레드·코드 캐시 몫(2GB 서버 기준).
      JAVA_TOOL_OPTIONS: "${API_JAVA_OPTS:--XX:MaxRAMPercentage=65 -XX:+ExitOnOutOfMemoryError}"
      # 클라이언트 IP 헤더를 믿는 프록시를 web 한 곳으로 한정한다(Tomcat RemoteIpValve 정규식). 사설 대역 전체를 믿지 않는다.
      SERVER_TOMCAT_REMOTEIP_INTERNALPROXIES: ${TRUSTED_PROXY_REGEX:-172\.31\.250\.10}
    secrets:
      - source: db_password
        target: DB_PASSWORD
      - source: valkey_password
        target: spring.data.redis.password
      - source: lostark_api_key
        target: LOSTARK_API_KEY
      # 원정대 전투력 불러오기의 표시 키 비밀값(16자 이상). 없으면 불러오기가 404다.
      - source: roster_marker_secret
        target: character.roster-combat-power.marker-secret
    volumes:
      # 통계 시드 파일(#271). 저장소에 커밋하지 않는다. 디렉터리가 없어도 기동한다(파일이 없으면 시드 없이 수집).
      - ./seed:/seed:ro
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      # 운영 이미지에는 curl·wget이 없어 bash /dev/tcp로 health를 확인한다.
      test:
        - CMD
        - bash
        - -c
        # 관리 포트가 metrics망 주소에만 묶여 있어 그 주소로 확인한다(127.0.0.1에는 열려 있지 않음).
        - "exec 3<>/dev/tcp/${API_METRICS_IP:?API_METRICS_IP가 필요합니다(env 예시 참고)}/9090 && printf 'GET /actuator/health/readiness HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q '\"status\":\"UP\"' <&3"
      interval: 15s
      timeout: 5s
      start_period: 90s
      retries: 5
    mem_limit: ${API_MEM_LIMIT:-768m}
    # 프로세스 수 상한(포크 폭주가 서버 전체로 번지지 않게). JVM 스레드도 pid로 센다(Tomcat 최대 200 + 풀·GC·배경 작업).
    pids_limit: 1024
    networks:
      internal: {}
      data: {}
      # 모니터링 수집용(prometheus만 함께 있는 망). 프로필을 끈 서버에서도 망만 있고 다른 컨테이너는 없다. 주소를 고정해 관리 포트를 여기에만 묶는다.
      metrics:
        ipv4_address: ${API_METRICS_IP:?API_METRICS_IP가 필요합니다(env 예시 참고)}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  postgres:
    image: postgres:18.6
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-loakraken}
      POSTGRES_USER: ${POSTGRES_USER:-loakraken}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    # shared_buffers는 메모리 한도의 약 25%(설계: 640m 한도 → 160MB). 비우면 postgres 기본값 128MB.
    command: ["postgres", "-c", "shared_buffers=${POSTGRES_SHARED_BUFFERS:-128MB}"]
    secrets:
      - db_password
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: ${POSTGRES_MEM_LIMIT:-384m}
    # 프로세스 수 상한(포크 폭주가 서버 전체로 번지지 않게). 연결마다 프로세스 하나 + 배경 프로세스.
    pids_limit: 256
    networks:
      - data
    security_opt:
      - no-new-privileges:true
    # 이미지 진입 스크립트가 root로 데이터 디렉터리 소유·권한을 맞춘 뒤 postgres 사용자로 낮춘다. 그 몇 가지만 남긴다.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID

  valkey:
    image: valkey/valkey:9.1.2
    restart: unless-stopped
    logging: *default-logging
    # 암호를 프로세스 인자에 넣지 않는다. 컨테이너 안 설정 파일(valkey 그룹만 읽기)에 쓰고,
    # 이미지 진입 스크립트에 .conf를 넘겨 valkey 사용자로 권한을 낮춰 실행한다(sh로 바로 실행하면 root로 돈다).
    # maxmemory를 컨테이너 한도보다 작게 둬, 캐시가 커져도 OOM으로 죽지 않고 만료 시간이 있는 키부터 덜 쓴 순서로 지운다.
    # 사용자별 권한: 기본 사용자는 끄고 앱 전용 사용자 app만 둔다. 위험 명령(CONFIG·FLUSH·KEYS 등)은 빼고 헬스 체크용 INFO만 남긴다.
    # api는 같은 암호에 사용자 이름 app으로 접속한다(api의 SPRING_DATA_REDIS_USERNAME).
    entrypoint:
      - tini
      - --
      - sh
      - -c
      - >-
        umask 027 &&
        printf 'user default off\nuser app on >%s ~* &* +@all -@dangerous +info\n' "$$(cat /run/secrets/valkey_password)" > /tmp/valkey.conf &&
        chgrp valkey /tmp/valkey.conf &&
        exec docker-entrypoint.sh /tmp/valkey.conf --appendonly yes
        --maxmemory ${VALKEY_MAXMEMORY:-96mb} --maxmemory-policy volatile-lru --maxmemory-samples 10
    secrets:
      - valkey_password
    volumes:
      - valkey-data:/data
    healthcheck:
      # 인증은 인자(-a) 대신 환경 변수로 넘겨 프로세스 목록에 암호가 남지 않게 한다.
      test:
        - CMD-SHELL
        - VALKEYCLI_AUTH="$$(cat /run/secrets/valkey_password)" valkey-cli --no-auth-warning --user app ping | grep -q PONG
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: ${VALKEY_MEM_LIMIT:-128m}
    # 프로세스 수 상한(포크 폭주가 서버 전체로 번지지 않게). 단일 스레드 + I/O 스레드 몇 개.
    pids_limit: 64
    networks:
      - data
    security_opt:
      - no-new-privileges:true
    # 진입 스크립트가 /data 소유를 맞추고(chown) valkey 사용자로 낮춘다(setpriv). 설정 파일 chgrp도 같은 권한.
    # 다시 뜰 때 root가 valkey 소유 appendonlydir(750) 안을 훑어야 해서 DAC_READ_SEARCH가 필요하다(없으면 find가 실패해 재시작을 반복).
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_READ_SEARCH
      - SETGID
      - SETUID

  # ── 모니터링(프로필 monitor) ─────────────────────────────────────────────
  # stack.env에 COMPOSE_PROFILES=monitor를 넣은 서버에서만 뜬다. 공개 포트 없음(grafana만 호스트 127.0.0.1에 묶는다).
  # 설정 디렉터리(./monitor/…)는 배포 번들과 함께 바뀌므로 pull-deploy가 배포 뒤 prometheus·grafana를 다시 만든다.
  prometheus:
    image: prom/prometheus:v3.13.4
    profiles: [monitor]
    restart: unless-stopped
    logging: *default-logging
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-15d}
      - --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-1GB}
    volumes:
      - ./monitor/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5
    mem_limit: ${PROMETHEUS_MEM_LIMIT:-384m}
    # prometheus·node-exporter·cloudflared는 프로세스 수 상한 128(실제 수십 개). grafana는 아래에 따로.
    pids_limit: 128
    networks:
      # metrics: api와 prometheus만 있는 망(api 관리 포트 9090 수집용, web·DB에는 닿지 않는다). monitor: grafana·node-exporter.
      - metrics
      - monitor
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  node-exporter:
    image: prom/node-exporter:v1.12.1
    profiles: [monitor]
    restart: unless-stopped
    logging: *default-logging
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      # 디스크 사용량은 서버 점검 스크립트(host-check)가 텍스트 파일로 넘기므로, 호스트 / 전체를 붙이지 않고 파일 시스템 수집을 끈다.
      - --no-collector.filesystem
      # host-check가 컨테이너 재시작 수·디스크 사용량을 이 디렉터리에 텍스트 파일로 남긴다.
      - --collector.textfile.directory=/textfile
    volumes:
      # 필요한 것만 읽기 전용으로: 메모리·CPU·스왑(/proc·/sys), host-check 텍스트 파일 디렉터리.
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /var/lib/node_exporter/textfile:/textfile:ro
    mem_limit: ${NODE_EXPORTER_MEM_LIMIT:-48m}
    pids_limit: 128
    networks:
      - monitor
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  grafana:
    image: grafana/grafana:13.2.4
    profiles: [monitor]
    restart: unless-stopped
    logging: *default-logging
    # 비밀 파일을 못 읽으면 grafana는 그래도 뜨고 기본 관리자 비밀번호가 남는다(10-19 재현). 그래서 시작 전에 확인하고,
    # 비밀번호 파일을 못 읽거나 12자 미만·admin이거나 Slack 웹훅 파일을 못 읽으면 시작하지 않는다(cloudflared도 grafana가 healthy일 때만 뜬다).
    entrypoint:
      - sh
      - -c
      - >-
        p=/run/secrets/grafana_admin_password; h=/run/secrets/slack_webhook_alerts; pw="";
        if [ -r "$$p" ]; then IFS= read -r pw < "$$p" || true; fi;
        if [ "$${#pw}" -lt 12 ] || [ "$$pw" = admin ] || [ ! -r "$$h" ] || [ ! -s "$$h" ]; then
        echo "GRAFANA_SECRET_CHECK_FAILED: 비밀 파일(관리자 비밀번호 12자 이상·Slack 웹훅)을 읽을 수 없음. 서버에서 444 권한·내용 확인" >&2; exit 1; fi;
        exec /run.sh
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_ALLOW_ORG_CREATE: "false"
      GF_AUTH_BASIC_ENABLED: "false"
      GF_SECURITY_COOKIE_SECURE: "${GRAFANA_COOKIE_SECURE:-true}"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      # 경보 메시지의 링크 주소. 접속 방법(SSH 터널 / 터널+Access)에 맞춰 stack.env에서 바꾼다.
      GF_SERVER_ROOT_URL: "${GRAFANA_ROOT_URL:-https://grafana.loakraken.gg}"
    secrets:
      - grafana_admin_password
      - slack_webhook_alerts
    volumes:
      - ./monitor/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitor/grafana/dashboards/loakraken:/var/lib/grafana/dashboards/loakraken:ro
      # 공개 대시보드(fetch-dashboards.sh가 받아 둔 것). 번들 밖 스택 디렉터리라 배포로 바뀌지 않는다.
      - ./grafana-dashboards:/var/lib/grafana/dashboards/external:ro
      - grafana-data:/var/lib/grafana
    ports:
      # 서버 안에서만(SSH 터널용). 인터넷에 열지 않는다.
      - "127.0.0.1:${GRAFANA_HOST_PORT:-3000}:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
    # 대시보드 3개·경보 규칙을 올린 상태에서 384m 한도의 99%까지 쓰는 것을 운영에서 확인해 512m로 둔다.
    mem_limit: ${GRAFANA_MEM_LIMIT:-512m}
    # grafana는 Go 스레드와 데이터 원본 플러그인 프로세스로 뜨자마자 170개 가까이 쓴다(128이면 플러그인이 죽음 — 로컬 측정). 4배 여유.
    pids_limit: 1024
    networks:
      # 경보를 Slack으로 보내야 해서 외부 통신이 되는 망.
      - monitor
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # Grafana 원격 접속: Cloudflare Tunnel(서버 안에서 Cloudflare로 나가는 연결만, 들어오는 포트 없음) + Access(허용 이메일만).
  # 터널·공개 주소·Access 정책은 Cloudflare 대시보드에서 만들고, 여기는 토큰 파일로 터널에 붙기만 한다.
  cloudflared:
    image: cloudflare/cloudflared:2026.9.3
    profiles: [monitor]
    restart: unless-stopped
    logging: *default-logging
    # 이미지 진입점이 이미 --no-autoupdate다. 토큰은 파일로만 받는다(2025.4.0 이상 --token-file).
    command: ["tunnel", "--metrics", "127.0.0.1:20241", "run", "--token-file", "/run/secrets/cloudflared_token"]
    secrets:
      - cloudflared_token
    read_only: true
    depends_on:
      grafana:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:20241", "ready"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    mem_limit: ${CLOUDFLARED_MEM_LIMIT:-64m}
    pids_limit: 128
    networks:
      # grafana:3000에만 닿으면 된다(api·DB 망에는 붙지 않는다).
      - monitor
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

secrets:
  db_password:
    file: ${SECRETS_DIR:?SECRETS_DIR가 필요합니다(스택별 경로, 예 /opt/loakraken/production/secrets)}/db_password
  valkey_password:
    file: ${SECRETS_DIR:?SECRETS_DIR가 필요합니다}/valkey_password
  lostark_api_key:
    file: ${SECRETS_DIR:?SECRETS_DIR가 필요합니다}/lostark_api_key
  roster_marker_secret:
    file: ${SECRETS_DIR:?SECRETS_DIR가 필요합니다}/roster_marker_secret
  # 모니터링(프로필 monitor)만 쓴다. 프로필을 켜지 않은 서버는 이 파일이 없어도 된다.
  grafana_admin_password:
    file: ${SECRETS_DIR:?SECRETS_DIR가 필요합니다}/grafana_admin_password
  slack_webhook_alerts:
    file: ${SECRETS_DIR:?SECRETS_DIR가 필요합니다}/slack_webhook_alerts
  cloudflared_token:
    file: ${SECRETS_DIR:?SECRETS_DIR가 필요합니다}/cloudflared_token

networks:
  # edge ↔ web만 연결한다.
  public:
  # web↔api. api가 공식 API를 불러야 해서 외부 통신을 막지 않는다. 서브넷을 고정해 web 주소를 신뢰 프록시로 쓴다.
  internal:
    ipam:
      config:
        - subnet: ${INTERNAL_SUBNET:-172.31.250.0/24}
  # api↔postgres·valkey. 외부 통신이 없는 망(DB·캐시는 인터넷에 나가지 않는다).
  data:
    internal: true
  # 모니터링(프로필 monitor): prometheus·node-exporter·grafana·cloudflared. grafana가 Slack, cloudflared가 Cloudflare로 나가야 해서 외부 통신을 막지 않는다.
  monitor:
  # api↔prometheus만(관리 포트 9090 수집). 외부 통신 없음. grafana·cloudflared는 이 망에 없어 api에 닿지 않는다.
  # 서브넷을 고정해 api 관리 포트를 이 망의 api 주소(API_METRICS_IP)에만 묶는다.
  metrics:
    internal: true
    ipam:
      config:
        - subnet: ${METRICS_SUBNET:?METRICS_SUBNET이 필요합니다(env 예시 참고)}

volumes:
  edge-data:
  edge-config:
  postgres-data:
  valkey-data:
  prometheus-data:
  grafana-data:
