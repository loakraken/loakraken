spring:
  application:
    name: loakraken

  threads:
    virtual:
      enabled: true

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  data:
    redis:
      connect-timeout: 1s
      timeout: 1s

lostark:
  api-key: ${LOSTARK_API_KEY:}
  connect-timeout: 3s
  read-timeout: 5s
  requests-per-minute: 90
  max-concurrent-requests: 4
  summary-ttl: 5m

springdoc:
  paths-to-match: /api/v1/**
  override-with-generic-response: false
  remove-broken-reference-definitions: false
  api-docs:
    version: OPENAPI_3_1
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true
