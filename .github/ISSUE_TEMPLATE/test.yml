name: "🧪 Test Issue"
description: "테스트 추가·보완 및 검증 환경 개선을 위한 이슈 템플릿"
labels: ["test"]
title: "[TEST] "
body:
  - type: markdown
    attributes:
      value: |
        ## 🌿 GitFlow 안내
        이슈 생성 후 발급된 번호로 `develop`에서 `test/{issueNumber}-{english-kebab-case}` 브랜치를 만듭니다.
        PR 대상은 `develop`입니다. 동작 변경이 필요한 경우 해당 기능·수정 이슈와 연결해 주세요.

  - type: textarea
    id: test-summary
    attributes:
      label: 📄 테스트 대상 및 목적
      description: 어떤 동작을 검증하고 어떤 검증 공백을 보완할지 작성해 주세요.
      placeholder: e.g. 같은 캐릭터의 동시 검색 요청에서 외부 API 중복 호출을 방지하는지 검증합니다.
    validations:
      required: true

  - type: dropdown
    id: test-scope
    attributes:
      label: 🔍 테스트 범위
      multiple: true
      options:
        - 단위 테스트
        - 통합 테스트
        - Repository 테스트
        - 외부 API Client 테스트
        - Controller 테스트
        - 아키텍처 테스트
        - 기타 검증
    validations:
      required: true

  - type: textarea
    id: test-cases
    attributes:
      label: ✅ 검증 시나리오 및 기대 결과
      description: 정상·예외·경계 조건별 입력과 기대 결과를 체크박스로 작성해 주세요.
      placeholder: |
        - [ ] 동일 캐릭터 동시 요청 시 외부 갱신 1회
        - [ ] 갱신 실패 후 다음 요청에서 정상 재조회
    validations:
      required: true

  - type: textarea
    id: execution-plan
    attributes:
      label: 🛠️ 실행 방법 및 완료 조건
      description: 실행 명령, 필요한 컨테이너·고정 응답 데이터, 통과 기준을 작성해 주세요. 비밀값은 포함하지 않습니다.
    validations:
      required: true
